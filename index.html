<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Anagesso</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js + DataLabels plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* ── LOGIN OVERLAY ─────────────────────────────────────── */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    #loginOverlay.hidden { display: none; }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-box .login-logo {
      display: block;
      max-width: 160px;
      max-height: 80px;
      object-fit: contain;
      margin: 0 auto 20px;
    }
    .login-box h5 {
      text-align: center;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 24px;
      font-size: 15px;
    }
    #loginError {
      display: none;
      font-size: 12px;
    }
    .login-box .btn-login {
      background: var(--accent);
      border: none;
      color: #1a1a2e;
      font-weight: 700;
      padding: 10px;
      font-size: 14px;
      border-radius: 8px;
      width: 100%;
      margin-top: 4px;
      transition: opacity 0.2s;
    }
    .login-box .btn-login:hover { opacity: 0.88; }
  </style>
</head>
<body>

  <!-- ── LOGIN OVERLAY ──────────────────────────────────────── -->
  <div id="loginOverlay">
    <div class="login-box">
      <img src="assets/logo.png" alt="Anagesso" class="login-logo" onerror="this.style.display='none'">
      <h5>Sistema de Gestão Anagesso</h5>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:12px;">Usuário</label>
        <input type="text" class="form-control" id="loginUsuario" placeholder="Digite seu usuário"
          onkeydown="if(event.key==='Enter') document.getElementById('loginSenha').focus()">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:12px;">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="loginSenha" placeholder="Digite sua senha"
            onkeydown="if(event.key==='Enter') Auth.login()">
          <button class="btn btn-outline-secondary" type="button" id="btnToggleSenha"
            onclick="Auth.toggleSenha()" tabindex="-1">
            <i class="bi bi-eye" id="icoSenha"></i>
          </button>
        </div>
      </div>
      <div class="alert alert-danger py-2 mb-3" id="loginError">Usuário ou senha incorretos.</div>
      <button class="btn-login" onclick="Auth.login()">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.png" alt="Anagesso" class="sidebar-logo" id="sidebarLogo">
      <small>Sistema de Gestão</small>
    </div>

    <nav>
      <div class="nav-section-label">Principal</div>
      <a href="#" data-page="dashboard" onclick="App.navigate('dashboard',this)">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>

      <div class="nav-section-label">Operacional</div>
      <a href="#" data-page="mao-de-obra" onclick="App.navigate('mao-de-obra',this)">
        <i class="bi bi-people-fill"></i> Mão de Obra
      </a>
      <a href="#" data-page="obras" onclick="App.navigate('obras',this)">
        <i class="bi bi-building-fill-check"></i> Obras
      </a>

      <div class="nav-section-label">Comercial</div>
      <a href="#" data-page="orcamentos" onclick="App.navigate('orcamentos',this)">
        <i class="bi bi-file-earmark-text-fill"></i> Orçamentos
      </a>
      <a href="#" data-page="clientes" onclick="App.navigate('clientes',this)">
        <i class="bi bi-person-lines-fill"></i> Clientes
      </a>

      <div class="nav-section-label">Financeiro</div>
      <a href="#" data-page="financeiro" onclick="App.navigate('financeiro',this)">
        <i class="bi bi-cash-coin"></i> Financeiro
      </a>

      <div class="nav-section-label">Cadastros</div>
      <a href="#" data-page="base-itens" onclick="App.navigate('base-itens',this)">
        <i class="bi bi-box-seam-fill"></i> Base de Itens
      </a>
    </nav>

    <div class="sidebar-footer">
      &copy; 2026 Anagesso
    </div>
  </aside>

  <!-- TOPBAR -->
  <div id="main">
    <header id="topbar">
      <button id="menuToggle" class="btn btn-sm btn-outline-secondary" onclick="App.toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <h4 id="pageTitle">Dashboard</h4>
      <span class="badge bg-warning text-dark ms-auto" id="badgeData"></span>
      <button class="btn btn-sm btn-outline-secondary ms-2" onclick="Auth.logout()" title="Sair">
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-md-inline ms-1">Sair</span>
      </button>
    </header>

    <!-- CONTENT -->
    <main id="content"></main>
  </div>

  <!-- LOADING -->
  <div id="loadingOverlay">
    <div class="spinner-border text-warning" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/mao-de-obra.js"></script>
  <script src="js/pages/obras.js"></script>
  <script src="js/pages/orcamentos.js"></script>
  <script src="js/pages/base-itens.js"></script>
  <script src="js/pages/clientes.js"></script>
  <script src="js/pages/financeiro.js"></script>

  <script>
    /* ── AUTH ───────────────────────────────────────────────── */
    const Auth = {
      SESSION_KEY: 'anagesso_auth',

      check() {
        return sessionStorage.getItem(this.SESSION_KEY) === '1';
      },

      login() {
        const u = document.getElementById('loginUsuario').value.trim();
        const s = document.getElementById('loginSenha').value;
        const err = document.getElementById('loginError');
        if (u === CONFIG.login.usuario && s === CONFIG.login.senha) {
          sessionStorage.setItem(this.SESSION_KEY, '1');
          err.style.display = 'none';
          document.getElementById('loginOverlay').classList.add('hidden');
          App.init();
        } else {
          err.style.display = 'block';
          document.getElementById('loginSenha').value = '';
          document.getElementById('loginSenha').focus();
        }
      },

      logout() {
        sessionStorage.removeItem(this.SESSION_KEY);
        location.reload();
      },

      toggleSenha() {
        const inp = document.getElementById('loginSenha');
        const ico = document.getElementById('icoSenha');
        if (inp.type === 'password') {
          inp.type = 'text';
          ico.className = 'bi bi-eye-slash';
        } else {
          inp.type = 'password';
          ico.className = 'bi bi-eye';
        }
      }
    };

    /* ── APP ────────────────────────────────────────────────── */
    const App = {
      pages: {
        'dashboard':   Dashboard,
        'mao-de-obra': MaoDeObra,
        'obras':       Obras,
        'orcamentos':  Orcamentos,
        'base-itens':  BaseItens,
        'clientes':    Clientes,
        'financeiro':  Financeiro,
      },

      navigate(page, el) {
        if (typeof event !== 'undefined' && event?.preventDefault) event.preventDefault();
        document.querySelectorAll('#sidebar nav a').forEach(a => a.classList.remove('active'));
        if (el) el.classList.add('active');
        const module = this.pages[page];
        if (module) module.render();
        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').classList.remove('open');
        }
      },

      toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
      },

      init() {
        document.getElementById('badgeData').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
        Chart.register(ChartDataLabels);
        const firstLink = document.querySelector('#sidebar nav a[data-page="dashboard"]');
        if (firstLink) firstLink.classList.add('active');
        Dashboard.render();
      }
    };

    /* ── BOOT ───────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.check()) {
        // Já autenticado — esconde login e inicia app
        document.getElementById('loginOverlay').classList.add('hidden');
        App.init();
      } else {
        // Mostra login; foca no campo usuário
        document.getElementById('loginUsuario').focus();
      }
    });
  </script>
</body>
</html>
